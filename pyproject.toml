[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "research-assistant-crew"
version = "0.2.0"
description = "Multi-agent research and synthesis crew with Progressive Credential Loading"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Sumit Dalavi" }
]
dependencies = [
    "crewai>=0.28.0",
    "langchain>=0.1.0",
    "langchain-openai>=0.1.0",
    "langchain-community>=0.0.20",
    "duckduckgo-search>=6.0.0",
    "openai>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "httpx>=0.24.0",
    "python-dotenv>=1.0.0"
]

[project.scripts]
research-crew = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
